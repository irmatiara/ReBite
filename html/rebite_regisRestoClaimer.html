<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebite - Pendaftaran Mitra & Claimer</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Palette Variables */
            --c-dark-brown: #2E2910;
            --c-brunswick: #2C5745;
            --c-brunswick-dark: #1E3F32;
            --c-tangerine: #EB7D00;
            --c-tangerine-hover: #D47000;
            --c-vanilla: #EBE3A7;
            --c-vanilla-soft: #FAF7E8;
            --c-bg-light: #F7F5EB;
            --c-white: #FFFFFF;
            
            /* UI Support Colors */
            --c-text-muted: #6B654C;
            --c-border: #D8D0A8;
            --c-card-shadow: rgba(46, 41, 16, 0.08);

            /* Design Tokens */
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Playfair Display', Georgia, serif;
            --radius-main: 24px;
            --radius-input: 14px;
            --transition-smooth: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--c-bg-light);
            color: var(--c-dark-brown);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 32px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Background Glows */
        .bg-decorations {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-blob-top {
            position: absolute;
            top: -100px;
            right: -80px;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(235, 125, 0, 0.12) 0%, rgba(247, 245, 235, 0) 70%);
            border-radius: 50%;
        }

        .bg-blob-bottom {
            position: absolute;
            bottom: -120px;
            left: -80px;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(44, 87, 69, 0.12) 0%, rgba(247, 245, 235, 0) 70%);
            border-radius: 50%;
        }

        .app-viewport {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            background-color: var(--c-bg-light);
            border-radius: var(--radius-main);
            border: 1px solid var(--c-border);
            box-shadow: 0 20px 48px var(--c-card-shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .hero-banner {
            background: linear-gradient(135deg, var(--c-brunswick) 0%, var(--c-brunswick-dark) 100%);
            position: relative;
            padding: 36px 24px 64px 24px;
            text-align: center;
            color: var(--c-vanilla);
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(235, 125, 0, 0.2);
            border: 1px solid rgba(235, 125, 0, 0.4);
            color: var(--c-vanilla);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .hero-badge svg {
            width: 14px;
            height: 14px;
            stroke: var(--c-tangerine);
            fill: none;
        }

        .hero-title {
            font-family: var(--font-serif);
            font-size: 1.7rem;
            color: var(--c-white);
            line-height: 1.25;
            font-weight: 700;
        }

        .hero-title em {
            font-style: italic;
            color: var(--c-vanilla);
        }

        /* Floating Logo Container */
        .logo-container {
            position: relative;
            margin-top: -42px;
            display: flex;
            justify-content: center;
            z-index: 2;
        }

        .logo-wrapper {
            width: 88px;
            height: 88px;
            background-color: var(--c-vanilla);
            border: 4px solid var(--c-bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 24px rgba(46, 41, 16, 0.15);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .logo-wrapper:hover {
            transform: scale(1.05) rotate(-2deg);
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .content-body {
            padding: 24px 28px 36px 28px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .welcome-head {
            text-align: center;
            margin-bottom: 22px;
        }

        .welcome-subtitle {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--c-tangerine);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }

        .headline-text {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--c-dark-brown);
            line-height: 1.35;
            letter-spacing: -0.02em;
        }

        /* Role Switcher */
        .role-switch-container {
            background-color: var(--c-vanilla);
            padding: 4px;
            border-radius: 18px;
            display: flex;
            position: relative;
            margin-bottom: 20px;
            border: 1px solid var(--c-border);
        }

        .role-indicator {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            width: calc(50% - 4px);
            background-color: var(--c-brunswick);
            border-radius: 14px;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 12px rgba(44, 87, 69, 0.22);
            transform: translateX(0%);
        }

        .role-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 11px 12px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--c-text-muted);
            cursor: pointer;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: color 0.3s ease;
        }

        .role-btn.active {
            color: var(--c-vanilla);
        }

        .role-btn svg {
            width: 17px;
            height: 17px;
            stroke-width: 2.2;
            stroke: currentColor;
            fill: none;
        }

        /* Informational Card */
        .info-box {
            background-color: var(--c-vanilla-soft);
            border-left: 3px solid var(--c-tangerine);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 22px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--c-dark-brown);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.45;
        }

        .info-box svg {
            width: 18px;
            height: 18px;
            stroke: var(--c-tangerine);
            fill: none;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--c-dark-brown);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            width: 18px;
            height: 18px;
            color: var(--c-text-muted);
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .input-field, .select-field {
            width: 100%;
            padding: 13px 16px 13px 46px;
            background-color: var(--c-white);
            border: 2px solid var(--c-border);
            border-radius: var(--radius-input);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            color: var(--c-dark-brown);
            font-weight: 600;
            outline: none;
            transition: var(--transition-smooth);
            appearance: none;
        }

        .input-field::placeholder {
            color: #A39D83;
            font-weight: 500;
        }

        .input-field:focus, .select-field:focus {
            border-color: var(--c-brunswick);
            box-shadow: 0 0 0 4px rgba(44, 87, 69, 0.12);
        }

        .input-field:focus + .input-icon, .select-field:focus + .input-icon {
            color: var(--c-brunswick);
        }

        .select-arrow {
            position: absolute;
            right: 14px;
            pointer-events: none;
            width: 16px;
            height: 16px;
            stroke: var(--c-text-muted);
            fill: none;
        }

        /* Checkbox Terms */
        .terms-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
            font-size: 0.82rem;
            color: var(--c-text-muted);
            font-weight: 600;
            line-height: 1.4;
        }

        .terms-wrapper input {
            display: none;
        }

        .custom-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid var(--c-border);
            border-radius: 6px;
            background-color: var(--c-white);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .terms-wrapper input:checked + .custom-checkbox {
            background-color: var(--c-brunswick);
            border-color: var(--c-brunswick);
        }

        .custom-checkbox svg {
            width: 12px;
            height: 12px;
            stroke: var(--c-vanilla);
            fill: none;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
        }

        .terms-wrapper input:checked + .custom-checkbox svg {
            opacity: 1;
            transform: scale(1);
        }

        .terms-link {
            color: var(--c-tangerine);
            text-decoration: none;
            font-weight: 700;
        }

        .terms-link:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--c-brunswick);
            color: var(--c-vanilla);
            border: none;
            border-radius: var(--radius-input);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(44, 87, 69, 0.25);
            transition: var(--transition-smooth);
        }

        .btn-submit svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
        }

        .btn-submit:hover {
            background-color: var(--c-brunswick-dark);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(44, 87, 69, 0.32);
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 0.88rem;
            color: var(--c-text-muted);
            font-weight: 600;
        }

        .login-link {
            color: var(--c-dark-brown);
            font-weight: 800;
            text-decoration: none;
            border-bottom: 2px solid var(--c-tangerine);
            padding-bottom: 2px;
            margin-left: 4px;
            transition: color 0.2s ease;
        }

        .login-link:hover {
            color: var(--c-tangerine);
        }

        /* Toast Feedback */
        .toast-msg {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--c-dark-brown);
            color: var(--c-vanilla);
            padding: 12px 22px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid var(--c-tangerine);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            pointer-events: none;
        }

        .toast-msg svg {
            width: 18px;
            height: 18px;
            stroke: var(--c-tangerine);
            fill: none;
        }

        .toast-msg.active {
            transform: translateX(-50%) translateY(0);
        }

        /* Hidden Form Sections Transition */
        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="bg-decorations">
        <div class="bg-blob-top"></div>
        <div class="bg-blob-bottom"></div>
    </div>

    <main class="app-viewport">
        
        <!-- Hero Header -->
        <header class="hero-banner">
            <div class="hero-badge">
                <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="8.5" cy="7" r="4"/>
                    <line x1="20" y1="8" x2="20" y2="14"/>
                    <line x1="23" y1="11" x2="17" y2="11"/>
                </svg>
                <span>Pendaftaran Rebite</span>
            </div>
            <h1 class="hero-title">Bergabung dalam Ekosistem <em>Penyelamat Makanan.</em></h1>
        </header>

        <!-- Logo Container -->
        <div class="logo-container">
            <a href="rebite_onboarding.html" class="logo-wrapper" title="Kembali ke Onboarding">
                <img 
                    src="assets/logo.jpe" 
                    alt="Rebite Logo" 
                    class="logo-img"
                    onerror="this.onerror=null; this.src='https://via.placeholder.com/120/EBE3A7/2C5745?text=ReBite';"
                >
            </a>
        </div>

        <!-- Form Area -->
        <div class="content-body">
            
            <div class="welcome-head">
                <p class="welcome-subtitle">Create Your Account</p>
                <h2 class="headline-text" id="headlineTitle">Daftar sebagai Claimer</h2>
            </div>

            <!-- Role Switcher -->
            <div class="role-switch-container">
                <div class="role-indicator" id="roleIndicator"></div>
                
                <button type="button" class="role-btn active" id="btnRoleClaimer" onclick="selectRole('claimer')">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span>Claimer</span>
                </button>
                
                <button type="button" class="role-btn" id="btnRoleResto" onclick="selectRole('resto')">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 21h18M3 7v1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7H3m1 14V11m16 10V11"/>
                        <path d="M5 4h14l1 3H4l1-3z"/>
                    </svg>
                    <span>Mitra Restoran</span>
                </button>
            </div>

            <!-- Dynamic Info Box -->
            <div class="info-box" id="infoBox">
                <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 16v-4"/>
                    <path d="M12 8h.01"/>
                </svg>
                <span id="infoText">
                    Dapatkan akses peta food bank terdekat, notifikasi diskon besar & makanan gratis, serta kesempatan sidejob antar makanan.
                </span>
            </div>

            <form id="signupForm" onsubmit="handleSignup(event)">
                
                <!-- SECTION: Claimer Form Fields -->
                <div class="form-section active" id="sectionClaimer">
                    <div class="form-group">
                        <label class="form-label" for="claimerName">Nama Lengkap</label>
                        <div class="input-wrapper">
                            <input type="text" id="claimerName" class="input-field" placeholder="Nama sesuai identitas">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="claimerPhone">Nomor WhatsApp / HP</label>
                        <div class="input-wrapper">
                            <input type="tel" id="claimerPhone" class="input-field" placeholder="08123456789">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                        </div>
                    </div>
                </div>

                <!-- SECTION: Restoran Form Fields -->
                <div class="form-section" id="sectionResto">
                    <div class="form-group">
                        <label class="form-label" for="restoName">Nama Restoran / Toko</label>
                        <div class="input-wrapper">
                            <input type="text" id="restoName" class="input-field" placeholder="Contoh: Dapur Kebajikan">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M3 7v1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7H3m1 14V11m16 10V11"/><path d="M5 4h14l1 3H4l1-3z"/></svg>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="restoCategory">Kategori Usaha</label>
                        <div class="input-wrapper">
                            <select id="restoCategory" class="select-field">
                                <option value="restoran">Restoran / Rumah Makan</option>
                                <option value="bakery">Bakery & Toko Roti</option>
                                <option value="catering">Jasa Katering</option>
                                <option value="supermarket">Supermarket / Toko Buah</option>
                                <option value="peternakan">Penyedia Pakan / Lainnya</option>
                            </select>
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                            <svg class="select-arrow" viewBox="0 0 24 24" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="restoAddress">Alamat Lengkap Usaha</label>
                        <div class="input-wrapper">
                            <input type="text" id="restoAddress" class="input-field" placeholder="Jl. Sudirman No. 12, Medan">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                        </div>
                    </div>
                </div>

                <!-- Shared Form Fields -->
                <div class="form-group">
                    <label class="form-label" for="userEmail">Email Akun</label>
                    <div class="input-wrapper">
                        <input type="email" id="userEmail" class="input-field" placeholder="email@rebite.id" required>
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="userPassword">Kata Sandi</label>
                    <div class="input-wrapper">
                        <input type="password" id="userPassword" class="input-field" placeholder="Minimal 8 karakter" required>
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                </div>

                <!-- Terms & Conditions Checkbox -->
                <label class="terms-wrapper">
                    <input type="checkbox" id="acceptTerms" required>
                    <span class="custom-checkbox">
                        <svg viewBox="0 0 24 24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </span>
                    <span>Saya menyetujui <a href="#" class="terms-link" onclick="triggerToast('Menampilkan Syarat & Ketentuan...'); return false;">Syarat & Ketentuan</a> serta Kebijakan Privasi Rebite.</span>
                </label>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit" id="btnSignupSubmit">
                    <span id="btnSubmitText">Buat Akun Claimer</span>
                    <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </button>

            </form>

            <div class="footer-note">
                <span>Sudah memiliki akun?</span>
                <a href="rebite_professional_login_page.html" class="login-link" id="loginPortalLink">Masuk Ke Portal Login</a>
            </div>

        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast-msg">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span id="toastText">Pesan notifikasi</span>
    </div>

    <script>
        let selectedRole = 'claimer';

        function selectRole(role) {
            selectedRole = role;
            const indicator = document.getElementById('roleIndicator');
            const btnClaimer = document.getElementById('btnRoleClaimer');
            const btnResto = document.getElementById('btnRoleResto');
            const btnSubmitText = document.getElementById('btnSubmitText');
            const infoText = document.getElementById('infoText');
            const headlineTitle = document.getElementById('headlineTitle');
            const loginPortalLink = document.getElementById('loginPortalLink');
            
            const sectionClaimer = document.getElementById('sectionClaimer');
            const sectionResto = document.getElementById('sectionResto');

            if (role === 'resto') {
                indicator.style.transform = 'translateX(100%)';
                btnResto.classList.add('active');
                btnClaimer.classList.remove('active');
                
                sectionResto.classList.add('active');
                sectionClaimer.classList.remove('active');

                headlineTitle.textContent = 'Daftar Mitra Restoran';
                btnSubmitText.textContent = 'Daftar sebagai Mitra Restoran';
                infoText.textContent = 'Daftarkan usaha Anda untuk mengelola kuota surplus makanan, jadwalkan donasi homeless, atau distribusikan pakan ternak.';
                if (loginPortalLink) loginPortalLink.href = 'rebite_partner_login.html';
            } else {
                indicator.style.transform = 'translateX(0%)';
                btnClaimer.classList.add('active');
                btnResto.classList.remove('active');

                sectionClaimer.classList.add('active');
                sectionResto.classList.remove('active');

                headlineTitle.textContent = 'Daftar sebagai Claimer';
                btnSubmitText.textContent = 'Buat Akun Claimer';
                infoText.textContent = 'Dapatkan akses peta food bank terdekat, notifikasi diskon besar & makanan gratis, serta kesempatan sidejob antar makanan.';
                if (loginPortalLink) loginPortalLink.href = 'rebite_professional_login_page.html';
            }
        }

        function handleSignup(event) {
            event.preventDefault();
            const email = document.getElementById('userEmail').value;
            const roleName = selectedRole === 'resto' ? 'Mitra Restoran' : 'Claimer';
            triggerToast(`Pendaftaran ${roleName} berhasil! Mengalihkan ke dashboard...`);
            setTimeout(() => {
                if (selectedRole === 'resto') {
                    window.location.href = 'rebite_restaurant_partner_dashboard.html';
                } else {
                    window.location.href = 'rebite_claimer_dashboard_map.html';
                }
            }, 800);
        }

        let toastTimer;
        function triggerToast(message) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            
            toastText.textContent = message;
            toast.classList.add('active');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('active');
            }, 3500);
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('role') === 'resto') {
            selectRole('resto');
        } else {
            selectRole('claimer');
        }
    </script>

</body>
</html>
