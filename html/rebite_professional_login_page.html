<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebite — Food Rescue & Sharing Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-dark-brown: #2E2910;
            --color-brunswick: #2C5745;
            --color-vanilla: #EBE3A7;
            --color-tangerine: #EB7D00;
            --color-bg-light: #F7F5EB;
            --color-white: #FFFFFF;
            --color-muted: #736E58;
            --color-border: #D1C9A0;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Playfair Display', Georgia, serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--color-bg-light);
            color: var(--color-dark-brown);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        .bg-decorations {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-shape-top {
            position: absolute;
            top: -120px;
            right: -100px;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(235, 125, 0, 0.12) 0%, rgba(235, 227, 167, 0) 70%);
            border-radius: 50%;
        }

        .bg-shape-bottom {
            position: absolute;
            bottom: -150px;
            left: -120px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(44, 87, 69, 0.10) 0%, rgba(235, 227, 167, 0) 70%);
            border-radius: 50%;
        }

        .app-viewport {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            background-color: var(--color-bg-light);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(46, 41, 16, 0.08);
        }

        @media (min-width: 480px) {
            .app-viewport {
                min-height: auto;
                margin: 40px auto;
                border-radius: 32px;
                border: 1px solid var(--color-border);
                overflow: hidden;
            }
        }

        .hero-banner {
            background-color: var(--color-tangerine);
            position: relative;
            padding: 40px 24px 70px 24px;
            text-align: center;
            border-bottom-left-radius: 36px;
            border-bottom-right-radius: 36px;
            background-image: radial-gradient(circle at 80% 20%, rgba(255,255,255,0.15) 0%, transparent 50%);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(46, 41, 16, 0.2);
            color: var(--color-vanilla);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 12px;
            backdrop-filter: blur(4px);
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: 1.85rem;
            color: var(--color-white);
            line-height: 1.25;
            font-weight: 700;
        }

        .hero-title em {
            font-style: italic;
            color: var(--color-vanilla);
        }

        .logo-container {
            position: relative;
            margin-top: -48px;
            display: flex;
            justify-content: center;
            z-index: 2;
        }

        .logo-wrapper {
            width: 96px;
            height: 96px;
            background-color: var(--color-vanilla);
            border: 4px solid var(--color-bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 24px rgba(46, 41, 16, 0.12);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .logo-wrapper:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .logo-wrapper img {
            width: 82%;
            height: 82%;
            object-fit: contain;
            border-radius: 50%;
        }

        .content-body {
            padding: 24px 28px 36px 28px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .welcome-text {
            text-align: center;
            margin-bottom: 24px;
        }

        .greeting-sub {
            font-size: 0.85rem;
            color: var(--color-brunswick);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
        }

        .headline {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--color-dark-brown);
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        .role-switch-container {
            background-color: var(--color-vanilla);
            padding: 5px;
            border-radius: 18px;
            display: flex;
            position: relative;
            margin-bottom: 28px;
            border: 1px solid var(--color-border);
        }

        .role-indicator {
            position: absolute;
            top: 5px;
            bottom: 5px;
            left: 5px;
            width: calc(50% - 5px);
            background-color: var(--color-brunswick);
            border-radius: 14px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(44, 87, 69, 0.25);
        }

        .role-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 16px;
            font-family: var(--font-main);
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--color-muted);
            cursor: pointer;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: color 0.3s ease;
        }

        .role-btn.active {
            color: var(--color-vanilla);
        }

        .role-btn svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.2;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--color-dark-brown);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            width: 20px;
            height: 20px;
            color: var(--color-muted);
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .input-field {
            width: 100%;
            padding: 15px 16px 15px 48px;
            background-color: var(--color-white);
            border: 2px solid var(--color-border);
            border-radius: 16px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            color: var(--color-dark-brown);
            font-weight: 600;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-field::placeholder {
            color: #A09A82;
            font-weight: 500;
        }

        .input-field:focus {
            border-color: var(--color-brunswick);
            box-shadow: 0 0 0 4px rgba(44, 87, 69, 0.12);
        }

        .input-field:focus + .input-icon {
            color: var(--color-brunswick);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--color-muted);
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            border-radius: 8px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--color-dark-brown);
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--color-muted);
            font-weight: 600;
            user-select: none;
        }

        .checkbox-container input {
            display: none;
        }

        .custom-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid var(--color-border);
            border-radius: 6px;
            background-color: var(--color-white);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .checkbox-container input:checked + .custom-checkbox {
            background-color: var(--color-brunswick);
            border-color: var(--color-brunswick);
        }

        .custom-checkbox svg {
            width: 12px;
            height: 12px;
            color: var(--color-vanilla);
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
        }

        .checkbox-container input:checked + .custom-checkbox svg {
            opacity: 1;
            transform: scale(1);
        }

        .forgot-link {
            color: var(--color-tangerine);
            font-weight: 700;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .forgot-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--color-brunswick);
            color: var(--color-vanilla);
            border: none;
            border-radius: 16px;
            font-family: var(--font-main);
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(44, 87, 69, 0.25);
            transition: all 0.25s ease;
        }

        .submit-btn:hover {
            background-color: #234637;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(44, 87, 69, 0.32);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .footer-note {
            text-align: center;
            margin-top: auto;
            padding-top: 28px;
            font-size: 0.9rem;
            color: var(--color-muted);
            font-weight: 600;
        }

        .footer-note a {
            color: var(--color-dark-brown);
            font-weight: 800;
            text-decoration: none;
            border-bottom: 2px solid var(--color-tangerine);
            padding-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="bg-decorations">
        <div class="bg-shape-top"></div>
        <div class="bg-shape-bottom"></div>
    </div>

    <main class="app-viewport">
        <!-- Hero Banner Header -->
        <header class="hero-banner">
            <div class="hero-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Food Rescue Platform
            </div>
            <h1 class="hero-title">Every Meal Deserves a <em>Second Chance.</em></h1>
        </header>

        <!-- Brand Logo Badge -->
        <div class="logo-container">
            <div class="logo-wrapper">
                <img src="assets/logo.jpe" alt="Rebite Logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/120/EBE3A7/2C5745?text=ReBite';">
            </div>
        </div>

        <!-- Form Body -->
        <div class="content-body">
            <div class="welcome-text">
                <p class="greeting-sub">Hi there, Welcome back</p>
                <h2 class="headline">Siap Menyelamatkan Makanan Hari Ini?</h2>
            </div>

            <!-- Role Selector -->
            <div class="role-switch-container">
                <div class="role-indicator" id="roleIndicator"></div>
                
                <button type="button" class="role-btn active" id="roleClaimerBtn" onclick="switchRole('claimer')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Pencari / Claimer
                </button>
                
                <button type="button" class="role-btn" id="roleRestoBtn" onclick="switchRole('resto')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 21h18M3 7v1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7m0 1a3 3 0 0 0 6 0V7H3m1 14V11m16 10V11"/><path d="M5 4h14l1 3H4l1-3z"/></svg>
                    Mitra Restoran
                </button>
            </div>

            <!-- Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Email / Username</label>
                    <div class="input-wrapper">
                        <input type="email" id="emailInput" class="input-field" placeholder="nama@email.com" required>
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Kata Sandi</label>
                    <div class="input-wrapper">
                        <input type="password" id="passwordInput" class="input-field" placeholder="••••••••" required>
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <div class="form-actions">
                    <label class="checkbox-container">
                        <input type="checkbox" checked>
                        <span class="custom-checkbox">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>
                        </span>
                        Ingat Saya
                    </label>
                    <a href="#" class="forgot-link">Lupa Sandi?</a>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="btnText">Masuk sebagai Claimer</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>

            <div class="footer-note">
                Belum memiliki akun Rebite? <a href="#">Daftar Akun</a>
            </div>
        </div>
    </main>

    <script>
        let currentRole = 'claimer';

        function switchRole(role) {
            currentRole = role;
            const indicator = document.getElementById('roleIndicator');
            const claimerBtn = document.getElementById('roleClaimerBtn');
            const restoBtn = document.getElementById('roleRestoBtn');
            const btnText = document.getElementById('btnText');

            if (role === 'resto') {
                indicator.style.transform = 'translateX(100%)';
                restoBtn.classList.add('active');
                claimerBtn.classList.remove('active');
                btnText.textContent = 'Masuk sebagai Mitra Restoran';
            } else {
                indicator.style.transform = 'translateX(0%)';
                claimerBtn.classList.add('active');
                restoBtn.classList.remove('active');
                btnText.textContent = 'Masuk sebagai Claimer';
            }
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a18.16 18.16 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('emailInput').value;
            alert(`Berhasil login sebagai ${currentRole === 'claimer' ? 'Claimer' : 'Mitra Restoran'} (${email})`);
        }
    </script>
</body>
</html>
